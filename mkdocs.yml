site_name: MANÁ · Documentación del proyecto
site_description: Sistema web de gestión de pensiones, ventas, caja e inventario para un restaurante
repo_url: https://github.com/GerardoAM15/mana
repo_name: GerardoAM15/mana
docs_dir: docs
theme:
  name: material
  language: es
  palette:
    primary: green
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
nav:
  - Inicio: index.md
  - Arquitectura: arquitectura.md
  - Ejecución y despliegue: despliegue.md
  - Unidad 3 (LP2):
      - Optimización y caché: optimizacion.md
      - Observabilidad: observabilidad.md
      - Paginación, auditoría y pruebas: calidad.md
      - Bitácora de estabilización: estabilizacion.md
      - Checklist final: checklist.md
