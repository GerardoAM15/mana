spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  jwt:
    secret: ${JWT_SECRET}
  admin:
    email: ${MANA_ADMIN_EMAIL:}
    password: ${MANA_ADMIN_PASSWORD:}
    dni: ${MANA_ADMIN_DNI:}

# Logs estructurados en JSON (formato ECS) para producción: cada línea incluye nivel, logger, mensaje y requestId.
logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
