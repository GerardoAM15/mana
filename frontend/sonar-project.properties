# Análisis de calidad del frontend con SonarQube (ver docs/calidad.md).
# El token NO va aquí: se pasa por -Dsonar.token o la variable SONAR_TOKEN.
sonar.projectKey=mana-frontend
sonar.projectName=MANÁ Frontend
sonar.sources=src
sonar.tests=src
sonar.inclusions=src/**/*.ts,src/**/*.html,src/**/*.css
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=src/environments/**
sonar.javascript.lcov.reportPaths=coverage/mana_frontend/lcov.info
sonar.sourceEncoding=UTF-8
